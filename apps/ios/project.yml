# Generate the Xcode project on a Mac:  brew install xcodegen && xcodegen generate
name: Opal
options:
  bundleIdPrefix: app.opal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Opal:
    type: application
    platform: iOS
    sources:
      - path: Opal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.opal.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        # Base URL of the Opal server. Debug uses your Mac's dev server.
        OPAL_BASE_URL: "https://opal.tailefea70.ts.net"
      configs:
        Debug:
          OPAL_BASE_URL: "http://localhost:3000"
    info:
      path: Opal/Info.plist
      properties:
        CFBundleDisplayName: Opal
        OpalBaseURL: $(OPAL_BASE_URL)
        UILaunchScreen: {}
        NSCameraUsageDescription: Take a photo to send to Opal.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: app.opal.auth
            CFBundleURLSchemes: [opal]
        NSAppTransportSecurity:
          # Only for talking to the local dev server; production is https.
          NSAllowsLocalNetworking: true
